<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор даты и времени</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        label { font-weight: bold; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000000);
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            margin-top: 10px;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <label for="date">Выберите дату:</label>
    <input type="date" id="date" required>

    <label for="time">Укажите любое время:</label>
    <!-- ЗАМЕНИЛИ SELECT НА INPUT TYPE=TIME (позволяет выбрать абсолютно любые часы и минуты) -->
    <input type="time" id="time" required>

    <button id="sendData">Подтвердить слот</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Установка даты по умолчанию (сегодня)
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('date').min = today;
        document.getElementById('date').value = today;

        // Установка времени по умолчанию (текущее время пользователя)
        const now = new Date();
        const currentHours = String(now.getHours()).padStart(2, '0');
        const currentMinutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('time').value = `${currentHours}:${currentMinutes}`;

        // Исправленный обработчик клика кнопки
        document.getElementById('sendData').addEventListener('click', () => {
            const rawDate = document.getElementById('date').value;
            const time = document.getElementById('time').value; // Теперь корректно забирает строку вида "14:35"

            if (!rawDate || !time) {
                alert("Пожалуйста, заполните дату и время");
                return;
            }

            const [year, month, day] = rawDate.split('-');
            const formattedDate = `${day}.${month}.${year}`;

            const data = JSON.stringify({
                date: formattedDate,
                time: time
            });

            // Отправка в телеграм-бот
            tg.sendData(data);
            tg.close();
        });
    </script>
</body>
</html>
